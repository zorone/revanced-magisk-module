cli-source = "inotia00/revanced-cli"
rv-brand = "ReVanced Extended"
build-mode = "both"
apkmirror-dlurl = "https://www.apkmirror.com/apk/google-inc/youtube"
# archive-dlurl = "https://archive.org/download/jhc-apks/apks/com.google.android.youtube"

[Youtube-Extended-Abknc]
enabled = true
app-name = "RVX YouTube"
patches-source = "anddea/revanced-patches"
cli-source = "inotia00/revanced-cli"
apkmirror-dlurl = "https://apkmirror.com/apk/google-inc/youtube/"
rv-brand = "ReVanced Extended"
build-mode = "both"
arch = "both"
included-patches = "'Custom branding icon for YouTube' 'Custom branding name for YouTube' 'Hide Shorts dimming' 'Hide shortcuts' 'MaterialYou' 'Change Version Code'"
excluded-patches = "'Disable splash animation' 'Enable debug logging'"
patcher-args = "-OiconType='Cairo' -OappIcon='mmt' -OdoubleTapLengthArrays='3, 5, 10, 15, 20, 30, 60, 120, 180' -OBackgroundColor='@android:color/transparent' -OpackageNameYouTube='rvx.android.youtube' -OiconType='rounded' -OchangeTopButtons=true -OchangeVersionCode=true -OsettingsLabel='eXtended' -OinsertPosition='@string/about_key' -OcornerRadius='4.0dip' -OdarkThemeBackgroundColor='?ytBaseBackground' -OlightThemeBackgroundColor='?ytBaseBackground' -OstrokeColor='?attr/ytChipBackground' -OdarkThemeBackgroundColor='@android:color/black' -OlightThemeBackgroundColor='@android:color/white -OsettingsMenuIcon='yt_alt'"

[Music-Extended-Abknc]
enabled = true
app-name = "RVX Music"
patches-source = "anddea/revanced-patches"
cli-source = "inotia00/revanced-cli"
apkmirror-dlurl = "https://www.apkmirror.com/apk/google-inc/youtube-music"
# archive-dlurl = "https://archive.org/download/jhc-apks/apks/com.google.android.apps.youtube.music"
rv-brand = "ReVanced Extended"
build-mode = "both"
included-patches = "'Hide overlay filter' 'Hide player overlay filter'"
# excluded-patches = "'Custom package name'"
patcher-args = "-OiconType='Cairo' -OappIcon='mmt' -OBackgroundColor='@android:color/transparent' -OpackageNameYouTube='rvx.android.music' -OiconType='rounded' -OchangeTopButtons=true -OchangeVersionCode=true -OsettingsLabel='eXtended' -OinsertPosition='@string/about_key' -OcornerRadius='4.0dip' -OdarkThemeBackgroundColor='?ytBaseBackground' -OlightThemeBackgroundColor='?ytBaseBackground' -OstrokeColor='?attr/ytChipBackground' -OdarkThemeBackgroundColor='@android:color/black' -OlightThemeBackgroundColor='@android:color/white' -OsettingsMenuIcon='yt_alt'"

